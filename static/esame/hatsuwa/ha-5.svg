<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Cedere il posto a un anziano sull'autobus">
  <rect width="360" height="240" fill="#f3f6fb"/>
  <!-- bus window frame -->
  <rect x="20" y="26" width="320" height="188" rx="14" fill="#dfe9f5"/>
  <rect x="34" y="40" width="150" height="70" rx="8" fill="#bcd3ee"/>
  <rect x="196" y="40" width="130" height="70" rx="8" fill="#bcd3ee"/>
  <!-- seat -->
  <rect x="210" y="150" width="110" height="20" rx="4" fill="#5b7fb0"/>
  <rect x="210" y="120" width="16" height="50" rx="4" fill="#5b7fb0"/>
  <!-- younger person offering (gesture to seat) -->
  <circle cx="110" cy="120" r="20" fill="#f0c39c"/>
  <path d="M92 117 q18 -22 36 0" fill="#3b3b3b"/>
  <rect x="92" y="143" width="36" height="52" rx="14" fill="#6ba0f2"/>
  <rect x="122" y="150" width="46" height="12" rx="6" fill="#f0c39c"/>
  <!-- elderly person with cane -->
  <circle cx="250" cy="120" r="18" fill="#f0c39c"/>
  <path d="M234 120 q16 -14 32 0" fill="#c9c9c9"/>
  <rect x="234" y="140" width="32" height="42" rx="12" fill="#b08968"/>
  <line x1="272" y1="140" x2="278" y2="188" stroke="#6b4f2a" stroke-width="4"/>
</svg>
