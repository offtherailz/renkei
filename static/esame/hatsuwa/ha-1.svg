  <!-- person entering -->
  <circle cx="110" cy="95" r="20" fill="#f0c39c"/>
  <path d="M92 92 q18 -22 36 0" fill="#3b3b3b"/>
  <rect x="92" y="118" width="36" height="55" rx="14" fill="#6ba0f2"/>
