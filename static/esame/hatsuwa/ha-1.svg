<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Entrare in casa di un amico">
  <rect width="360" height="240" fill="#f3f6fb"/>
  <rect x="20" y="30" width="320" height="180" rx="12" fill="#e8eef7"/>
  <!-- doorway -->
  <rect x="210" y="50" width="110" height="150" rx="6" fill="#d9c3a3"/>
  <rect x="222" y="62" width="86" height="126" rx="4" fill="#b98f5e"/>
